      - name: Set up Docker Buildx
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Download 'kraftkit.sh/myself' artifacts
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myself-oci-image
          path: /tmp

      - name: Download 'kraftkit.sh/qemu' artifacts
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qemu-oci-image
          path: /tmp

      - name: Load Docker image
        if: ${{ steps.check-run.outputs.run == 'true' }}
        run: |
          for I in /tmp/*.tar; do docker load --input "${I}"; done

      - name: Login to Registry
        if: ${{ steps.check-run.outputs.run == 'true' && github.event_name == 'push' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: index.unikraft.io
          username: ${{ secrets.REG_USERNAME }}
          password: ${{ secrets.REG_TOKEN }}

      - name: Build OCI Image
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          tags: kraftkit.sh/github-action:v1
          platforms: linux/amd64
          file: ./buildenvs/github-action.Dockerfile
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          context: .
        env:
          KRAFTKIT_VERSION: blahblahblah

      - name: Fetch helloworld
        if: ${{ steps.check-run.outputs.run == 'true' && github.event_name != 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: unikraft/app-helloworld
          fetch-depth: 1
          path: _helloworld

      - name: Integration test
        if: ${{ steps.check-run.outputs.run == 'true' && github.event_name != 'push' }}
        uses: ./
        with:
          loglevel: debug
          workdir: _helloworld
          arch: x86_64
          plat: qemu
          name: helloworld
          execute: true

      - name: Push OCI Image
        if: ${{ steps.check-run.outputs.run == 'true' && github.event_name == 'push' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: index.unikraft.io/kraftkit.sh/github-action:v1
          platforms: linux/amd64
          file: ./buildenvs/github-action.Dockerfile
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
