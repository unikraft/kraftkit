      - name: Login to OCI registry
        if: ${{ steps.check-run.outputs.run == 'true' && github.event_name == 'push' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: index.unikraft.io
          username: ${{ secrets.REG_USERNAME }}
          password: ${{ secrets.REG_TOKEN }}

      - name: Download 'kraftkit.sh/myself' artifacts
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: myself-oci-image
          path: /tmp

      - name: Download 'kraftkit.sh/qemu' artifacts
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qemu-oci-image
          path: /tmp

      - name: Download 'kraftkit.sh/xen' artifacts
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xen-oci-image
          path: /tmp

      - name: Load Docker image
        if: ${{ steps.check-run.outputs.run == 'true' }}
        run: |
          for I in /tmp/*.tar; do docker load --input "${I}"; done

      - name: Build OCI image
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          file: ./buildenvs/base.Dockerfile
          tags: kraftkit.sh/base:latest
          platforms: linux/amd64
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/base.tar

      - name: Upload Docker image artifact
        if: ${{ steps.check-run.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: base-oci-image
          path: /tmp/base.tar

      - name: Push OCI Image
        if: ${{ steps.check-run.outputs.run == 'true' && github.event_name == 'push' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: index.unikraft.io/kraftkit.sh/base:latest
          platforms: linux/amd64
          file: ./buildenvs/base.Dockerfile
